name: Deploy Docs

on:
    push:
        branches:
            - main
            - v1.x
    workflow_dispatch:

concurrency:
    group: deploy-docs
    cancel-in-progress: true

jobs:
    deploy-docs:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  run_install: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Generate multi-version docs
              run: bash scripts/generate-multidoc.sh tmp/docs-combined

            # Skills only live on main (they're a v2 concept). Source from origin/main
            # so v1.x-triggered builds still publish them.
            - name: Checkout skills from main
              uses: actions/checkout@v6
              with:
                  ref: main
                  sparse-checkout: skills
                  sparse-checkout-cone-mode: false
                  path: main-skills

            # Publishes skills/<name>/SKILL.md at /.well-known/agent-skills/ on the docs origin.
            # Requires the docs site to be served at the origin root (custom subdomain
            # ts.sdk.modelcontextprotocol.io). A GitHub Pages project subpath would break
            # RFC 8615 origin-root discovery.
            - name: Build agent skills index
              uses: agentskills/build-for-well-known@v1
              with:
                  skills: main-skills/skills
                  output: tmp/docs-combined/.well-known/agent-skills

            # Jekyll silently drops directories starting with "." (including .well-known/).
            - name: Disable Jekyll
              run: touch tmp/docs-combined/.nojekyll

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: tmp/docs-combined

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
